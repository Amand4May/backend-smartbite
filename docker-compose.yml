version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartbite
      POSTGRES_USER: smartbite
      POSTGRES_PASSWORD: smartbite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: >
      sh -c "python manage.py makemigrations --noinput &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn app.wsgi:application --bind 0.0.0.0:8000 --reload"
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "dev-secret-change-in-production"
      POSTGRES_DB: smartbite
      POSTGRES_USER: smartbite
      POSTGRES_PASSWORD: smartbite
      POSTGRES_HOST: db
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
    depends_on:
      - db

volumes:
  postgres_data:
